name: Hanazukan
options:
  bundleIdPrefix: io.github.nezumihi12
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGNING_ALLOWED: NO
targets:
  Hanazukan:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Resources
      - path: Shared
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - target: YuukaWidgets
    entitlements:
      path: Config/Hanazukan.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.nezumihi12.hanazukan]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nezumihi12.hanazukan
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Hanazukan
        CFBundleName: Hanazukan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [hanazukan]
            CFBundleURLName: io.github.nezumihi12.hanazukan.review
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: 観察した植物の場所を、現在地を記録する操作時だけ取得します。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  YuukaWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nezumihi12.hanazukan.widgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Config/Widgets-Info.plist
      properties:
        CFBundleDisplayName: 幽香と復習
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.nezumihi12.hanazukan]
  HanazukanTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Hanazukan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Hanazukan:
    build:
      targets:
        Hanazukan: all
        YuukaWidgets: all
        HanazukanTests: [test]
    test:
      targets: [HanazukanTests]
      gatherCoverageData: true
